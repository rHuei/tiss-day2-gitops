apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-fg01
  namespace: argocd
spec:
  project: fg01
  source:
    repoURL: https://github.com/rHuei/tiss-day2-gitops.git
    targetRevision: main
    path: hello/overlays/lab
  destination:
    server: https://kubernetes.default.svc
    namespace: fg01
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
