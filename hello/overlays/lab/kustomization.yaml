apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fg01
resources:
- ../../base
- httproute.yaml
images:
- name: hello
  newName: ghcr.io/rhuei/hello      # GHCR 路徑必須全小寫
  newTag: a78e921                    # GitHub Actions 每次 build 後會改成 commit 前 7 碼
configMapGenerator:
- name: hello-env
  literals:
  - NAME=K8S
  - VERSION=a78e921                  # 由 GitHub Actions 一起更新，網頁上看得到目前版本
