# kubectl apply -f root.yaml（或在 Argo CD 網頁 NEW APP 建立，Path: apps）
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-fg01
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rHuei/tiss-day2-gitops.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
